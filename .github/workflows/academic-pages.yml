name: Biblioteca académica

on:
  push:
    branches: [main]
    paths: ['content/**', 'web/**', 'scripts/check-web.mjs', 'package.json', 'package-lock.json', '.github/workflows/academic-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run web:check
      - run: npm run web:build
        env:
          WEB_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
