[project]
name = "academic-automation"
version = "0.1.0"
description = "Automatización académica DCC/MIA en macOS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.42,<2",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "playwright>=1.50,<2", "markdown-it-py>=3,<5",
  "jsonschema>=4.23,<5", "regex>=2024.11", "filelock>=3.17,<4",
]

[dependency-groups]
dev = ["pytest>=7.4,<10", "ruff>=0.11,<1"]

[project.scripts]
academic = "academic_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_automation", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

